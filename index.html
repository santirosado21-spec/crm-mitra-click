    <meta charset="UTF-8" />

    <!-- Apple touch icons — diferentes tamaños para que iOS elija el óptimo
         según el device. iOS aplica esquinas redondeadas automáticamente. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="76x76"   href="/apple-touch-icon-76.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />

    <!-- PWA / Add-to-Home-Screen: cuando se agrega al inicio en iPhone se
         abre como app standalone (sin barra de Safari) con título "Supply Chain MX". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Supply Chain MX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e3a5f" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CRM Supply Chain México — Gestión integral de operaciones logísticas, cotizaciones y facturación." />
